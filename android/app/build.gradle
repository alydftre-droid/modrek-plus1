apply plugin: 'com.android.application'

def keystoreFile = file('keystore/release.keystore')
def hasReleaseKeystore = keystoreFile.exists()

android {
    namespace = "com.modrek.plus"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.modrek.plus"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 37
        versionName "1.1.34"

        // لا يوجد كود أصلي (NDK) في التطبيق، لذلك لا نضع أي فلاتر ABI
        // ولا فلاتر كثافة/لغة — أي فلتر هنا يحجب أجهزة عن التثبيت.
        // النتيجة: حزمة واحدة تعمل على arm64-v8a / armeabi-v7a / x86 / x86_64.
        ndk {
            abiFilters.clear()
        }
        // ملاحظة: لا نستخدم resConfigs إطلاقاً — تقييد اللغات/الكثافات
        // يمنع Play من تسليم الحزمة لبعض الأجهزة.
    }

    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    // App Bundle: نُبقي كل اللغات داخل الحزمة الأساسية (التطبيق عربي بالكامل)
    // حتى لا تفشل الترجمة على أجهزة بلغة نظام مختلفة، ونترك تقسيم
    // ABI/الكثافة مفعّلاً (بدون أثر لعدم وجود كود أصلي).
    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    // لا تُضمَّن قائمة التبعيات في APK لكن تُضمَّن في AAB كما يتطلب Play.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }


    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile keystoreFile
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: ''
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        release {
            // R8 (code shrinking + obfuscation + optimization) مفعّل لحماية الكود الأصلي.
            // منطق التطبيق كامل داخل حزمة JS في WebView ولا يتأثر.
            // قواعد keep الشاملة موجودة في proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    // Firebase Cloud Messaging for OS-level push notifications (works while app is closed)
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Apply the Google Services (Firebase) plugin only when google-services.json
// is present. This keeps CI builds green even before FCM is configured.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
