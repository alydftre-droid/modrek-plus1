name: Sync external Supabase (schema + functions + data)

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/**'
      - '.github/workflows/sync-external-schema.yml'
  workflow_dispatch:
    inputs:
      run_data_migration:
        description: 'Run full data migration scripts (migrate_to_external_supabase + rebind users + storage transfer)'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      PRODUCTION_SUPABASE_PROJECT_REF: qteuqfntsocsdbjmdvmr
      EXTERNAL_SUPABASE_DB_URL: ${{ secrets.EXTERNAL_SUPABASE_DB_URL }}
      EXTERNAL_SUPABASE_URL: ${{ secrets.EXTERNAL_SUPABASE_URL }}
      EXTERNAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.EXTERNAL_SUPABASE_SERVICE_ROLE_KEY }}
      EXTERNAL_SUPABASE_PROJECT_REF: ${{ secrets.EXTERNAL_SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Source (internal Lovable) – used by migration/storage transfer scripts
      SOURCE_SUPABASE_DB_URL: ${{ secrets.SOURCE_SUPABASE_DB_URL }}
      SOURCE_SUPABASE_URL: ${{ secrets.SOURCE_SUPABASE_URL }}
      SOURCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SOURCE_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SOURCE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SOURCE_SUPABASE_SERVICE_ROLE_KEY }}
      # Edge-function secrets to mirror on external project
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
      BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
      BUNNY_STORAGE_API_KEY: ${{ secrets.BUNNY_STORAGE_API_KEY }}
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase
          supabase --version

      # ---------- 0. Guard: require external DB URL ----------
      - name: Verify required secrets
        run: |
          if [ -z "$EXTERNAL_SUPABASE_DB_URL" ]; then
            echo "EXTERNAL_SUPABASE_DB_URL secret is not set — aborting."
            exit 1
          fi
          if [ -z "$EXTERNAL_SUPABASE_PROJECT_REF" ]; then
            echo "EXTERNAL_SUPABASE_PROJECT_REF secret is not set — aborting."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret is not set — aborting."
            exit 1
          fi
          if [ "$EXTERNAL_SUPABASE_PROJECT_REF" != "$PRODUCTION_SUPABASE_PROJECT_REF" ]; then
            echo "EXTERNAL_SUPABASE_PROJECT_REF must equal $PRODUCTION_SUPABASE_PROJECT_REF for production sync."
            exit 1
          fi
          if [[ "$EXTERNAL_SUPABASE_DB_URL" != *"$PRODUCTION_SUPABASE_PROJECT_REF"* ]]; then
            echo "EXTERNAL_SUPABASE_DB_URL does not point to production project $PRODUCTION_SUPABASE_PROJECT_REF."
            exit 1
          fi
          if [ -n "$EXTERNAL_SUPABASE_URL" ] && [[ "$EXTERNAL_SUPABASE_URL" != *"$PRODUCTION_SUPABASE_PROJECT_REF"* ]]; then
            echo "EXTERNAL_SUPABASE_URL does not point to production project $PRODUCTION_SUPABASE_PROJECT_REF."
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "WARNING: GEMINI_API_KEY is missing — AI assistant functions will deploy but will fail at runtime."
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.run_data_migration }}" = "true" ]; then
            if [ -z "$SUPABASE_URL" ]; then
              echo "SOURCE_SUPABASE_URL secret is required for data migration runs."
              exit 1
            fi
            if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
              echo "SOURCE_SUPABASE_SERVICE_ROLE_KEY secret is required for data migration runs."
              exit 1
            fi
          fi

      - name: Authenticate Supabase CLI against external production project
        run: |
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase projects list | grep -q "$PRODUCTION_SUPABASE_PROJECT_REF"

      # ---------- 1. Schema migrations (idempotent) ----------
      - name: Apply repo migrations to external DB
        run: |
          psql "$EXTERNAL_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "create schema if not exists supabase_migrations; create table if not exists supabase_migrations.schema_migrations (version text primary key, statements text[], name text);"
          for file in $(ls supabase/migrations/*.sql | sort); do
            version="$(basename "$file" | cut -d_ -f1)"
            if psql "$EXTERNAL_SUPABASE_DB_URL" -At -c "select 1 from supabase_migrations.schema_migrations where version = '$version' limit 1" | grep -q 1; then
              echo "Skipping already applied $file"
              continue
            fi
            echo "Applying $file"
            psql "$EXTERNAL_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$file"
            psql "$EXTERNAL_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
              -c "insert into supabase_migrations.schema_migrations(version, statements, name) values ('$version', ARRAY[]::text[], '$(basename "$file")') on conflict (version) do nothing"
          done

      # ---------- 2. Mirror edge-function secrets ----------
      - name: Set edge function secrets on external project
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.EXTERNAL_SUPABASE_PROJECT_REF != ''
        run: |
          set -e
          PAIRS=(
            "GEMINI_API_KEY=$GEMINI_API_KEY"
            "LOVABLE_API_KEY=$LOVABLE_API_KEY"
            "BUNNY_API_KEY=$BUNNY_API_KEY"
            "BUNNY_STORAGE_API_KEY=$BUNNY_STORAGE_API_KEY"
            "LIVEKIT_URL=$LIVEKIT_URL"
            "LIVEKIT_API_KEY=$LIVEKIT_API_KEY"
            "LIVEKIT_API_SECRET=$LIVEKIT_API_SECRET"
            "FIREBASE_SERVICE_ACCOUNT=$FIREBASE_SERVICE_ACCOUNT"
          )
          ARGS=()
          for p in "${PAIRS[@]}"; do
            VAL="${p#*=}"
            if [ -n "$VAL" ]; then ARGS+=("$p"); fi
          done
          if [ ${#ARGS[@]} -gt 0 ]; then
            supabase secrets set --project-ref "$EXTERNAL_SUPABASE_PROJECT_REF" "${ARGS[@]}"
          else
            echo "No secret values provided; skipping."
          fi

      # ---------- 3. Deploy all edge functions ----------
      - name: Deploy edge functions to external project
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.EXTERNAL_SUPABASE_PROJECT_REF != ''
        run: |
          set -e
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            if [ "$name" = "_shared" ]; then continue; fi
            [ -f "$dir/index.ts" ] || continue
            echo "Deploying function: $name"
            supabase functions deploy "$name" \
              --project-ref "$EXTERNAL_SUPABASE_PROJECT_REF" \
              --no-verify-jwt || supabase functions deploy "$name" --project-ref "$EXTERNAL_SUPABASE_PROJECT_REF"
          done

      # ---------- 4. Optional: full data migration ----------
      - name: Run data migration scripts (opt-in)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_data_migration == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests psycopg2-binary
          echo "→ migrate_to_external_supabase.py"
          python scripts/migrate_to_external_supabase.py --allow-destructive-reseed || true
          echo "→ rebind_external_auth_users.py --create-missing"
          python scripts/rebind_external_auth_users.py --create-missing || true
          echo "→ transfer_external_storage.py"
          python scripts/transfer_external_storage.py || true
