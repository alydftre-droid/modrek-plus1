name: Sync external Supabase (schema + functions + auth)

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/**'
      - '.github/workflows/sync-external-schema.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      EXTERNAL_SUPABASE_PROJECT_REF: qteuqfntsocsdbjmdvmr
      EXTERNAL_SUPABASE_URL: https://qteuqfntsocsdbjmdvmr.supabase.co
      EXTERNAL_SUPABASE_DB_URL: ${{ secrets.EXTERNAL_SUPABASE_DB_URL }}
      EXTERNAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.EXTERNAL_SUPABASE_SERVICE_ROLE_KEY }}
      SOURCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SOURCE_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DISABLE_KEYRING: 'true'
      # Edge-function secrets to mirror on external project
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
      BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
      BUNNY_STORAGE_API_KEY: ${{ secrets.BUNNY_STORAGE_API_KEY }}
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required CLIs are available
        run: |
          set -e
          supabase --version
          psql --version



      # ---------- 0. Guard: require external production secrets only ----------
      - name: Verify required secrets and environment
        run: |
          set -euo pipefail
          if [ -z "$EXTERNAL_SUPABASE_DB_URL" ]; then
            echo "EXTERNAL_SUPABASE_DB_URL secret is not set — aborting."
            exit 1
          fi
          if [ -z "$EXTERNAL_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "WARNING: EXTERNAL_SUPABASE_SERVICE_ROLE_KEY is not set — auth reconciliation will be skipped."
          fi
          if [ -z "$SOURCE_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "WARNING: SOURCE_SUPABASE_SERVICE_ROLE_KEY is not set — auth/user migration step will be skipped (non-fatal)."
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret is not set — aborting."
            exit 1
          fi
          if [[ "$EXTERNAL_SUPABASE_DB_URL" != *"$EXTERNAL_SUPABASE_PROJECT_REF"* ]]; then
            echo "EXTERNAL_SUPABASE_DB_URL does not point to production project $EXTERNAL_SUPABASE_PROJECT_REF."
            exit 1
          fi
          if [[ "$EXTERNAL_SUPABASE_URL" != "https://$EXTERNAL_SUPABASE_PROJECT_REF.supabase.co" ]]; then
            echo "EXTERNAL_SUPABASE_URL does not match production project $EXTERNAL_SUPABASE_PROJECT_REF."
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "WARNING: GEMINI_API_KEY is missing — AI assistant functions will deploy but will fail at runtime."
          fi
          echo "Required vars: EXTERNAL_SUPABASE_PROJECT_REF, EXTERNAL_SUPABASE_URL, EXTERNAL_SUPABASE_DB_URL, EXTERNAL_SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ACCESS_TOKEN"

      - name: Authenticate Supabase CLI against external production project
        run: |
          set -e
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase projects list | grep -q "$EXTERNAL_SUPABASE_PROJECT_REF"

      # ---------- 1. Schema migrations (idempotent) ----------
      - name: Apply repo migrations to external DB
        run: |
          set -euo pipefail
          psql "$EXTERNAL_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "create schema if not exists supabase_migrations; create table if not exists supabase_migrations.schema_migrations (version text primary key, statements text[], name text);"
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migration files found."
            exit 0
          fi
          IFS=$'\n' files=($(printf '%s\n' "${files[@]}" | sort))
          for file in "${files[@]}"; do
            version="$(basename "$file" | cut -d_ -f1)"
            if psql "$EXTERNAL_SUPABASE_DB_URL" -At -c "select 1 from supabase_migrations.schema_migrations where version = '$version' limit 1" | grep -q 1; then
              echo "Skipping already applied $file"
              continue
            fi
            echo "Applying $file"
            psql "$EXTERNAL_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$file"
            psql "$EXTERNAL_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
              -c "insert into supabase_migrations.schema_migrations(version, statements, name) values ('$version', ARRAY[]::text[], '$(basename "$file")') on conflict (version) do nothing"
          done

      # ---------- 2. External-only auth/user reconciliation ----------
      - name: Reconcile external auth users with public tables
        if: env.SOURCE_SUPABASE_SERVICE_ROLE_KEY != '' && env.EXTERNAL_SUPABASE_SERVICE_ROLE_KEY != ''
        run: |
          set -euo pipefail
          python scripts/rebind_external_auth_users.py --create-missing

      - name: Skip auth migration notice
        if: env.SOURCE_SUPABASE_SERVICE_ROLE_KEY == '' || env.EXTERNAL_SUPABASE_SERVICE_ROLE_KEY == ''
        run: echo "::notice::Auth/user migration skipped — required service role key not provided. Continuing with schema + edge function deployment."

      - name: Verify external schema bootstrap
        run: |
          set -euo pipefail
          for table in public.profiles public.user_roles public.wallets; do
            if [ "$(psql "$EXTERNAL_SUPABASE_DB_URL" -At -c "select to_regclass('$table')")" != "$table" ]; then
              echo "Missing required table: $table"
              exit 1
            fi
          done
          psql "$EXTERNAL_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select count(*) from supabase_migrations.schema_migrations" >/dev/null

      # ---------- 3. Mirror edge-function secrets ----------
      - name: Set edge function secrets on external project
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.EXTERNAL_SUPABASE_PROJECT_REF != ''
        run: |
          set -e
          PAIRS=(
            "GEMINI_API_KEY=$GEMINI_API_KEY"
            "LOVABLE_API_KEY=$LOVABLE_API_KEY"
            "BUNNY_API_KEY=$BUNNY_API_KEY"
            "BUNNY_STORAGE_API_KEY=$BUNNY_STORAGE_API_KEY"
            "LIVEKIT_URL=$LIVEKIT_URL"
            "LIVEKIT_API_KEY=$LIVEKIT_API_KEY"
            "LIVEKIT_API_SECRET=$LIVEKIT_API_SECRET"
            "FIREBASE_SERVICE_ACCOUNT=$FIREBASE_SERVICE_ACCOUNT"
          )
          ARGS=()
          for p in "${PAIRS[@]}"; do
            VAL="${p#*=}"
            if [ -n "$VAL" ]; then ARGS+=("$p"); fi
          done
          if [ ${#ARGS[@]} -gt 0 ]; then
            supabase secrets set --project-ref "$EXTERNAL_SUPABASE_PROJECT_REF" "${ARGS[@]}"
          else
            echo "No secret values provided; skipping."
          fi

      # ---------- 4. Deploy all edge functions ----------
      - name: Deploy edge functions to external project
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.EXTERNAL_SUPABASE_PROJECT_REF != ''
        run: |
          set -e
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            if [ "$name" = "_shared" ]; then continue; fi
            [ -f "$dir/index.ts" ] || continue
            echo "Deploying function: $name"
            supabase functions deploy "$name" \
              --project-ref "$EXTERNAL_SUPABASE_PROJECT_REF" \
              --no-verify-jwt || supabase functions deploy "$name" --project-ref "$EXTERNAL_SUPABASE_PROJECT_REF"
          done
