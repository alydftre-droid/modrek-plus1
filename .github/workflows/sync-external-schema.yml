name: Sync external database schema

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'scripts/**'
      - '.github/workflows/sync-external-schema.yml'
  workflow_dispatch:

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    if: ${{ secrets.EXTERNAL_SUPABASE_DB_URL != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Apply repo migrations to external database
        run: |
          psql "$EXTERNAL_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "create schema if not exists supabase_migrations; create table if not exists supabase_migrations.schema_migrations (version text primary key, statements text[], name text);"

          for file in $(ls supabase/migrations/*.sql | sort); do
            version="$(basename "$file" | cut -d_ -f1)"

            if psql "$EXTERNAL_SUPABASE_DB_URL" -At -c "select 1 from supabase_migrations.schema_migrations where version = '$version' limit 1" | grep -q 1; then
              echo "Skipping already applied migration $file"
              continue
            fi

            echo "Applying $file"
            psql "$EXTERNAL_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$file"
            psql "$EXTERNAL_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version, statements, name) values ('$version', ARRAY[]::text[], '$(basename "$file")') on conflict (version) do nothing"
          done
        env:
          EXTERNAL_SUPABASE_DB_URL: ${{ secrets.EXTERNAL_SUPABASE_DB_URL }}
