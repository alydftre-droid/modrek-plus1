name: Build Android APK + AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Install dependencies
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install --no-audit --no-fund

      - name: Verify toolchain versions
        run: |
          node -v
          npm -v
          npx cap --version

      - name: Build web project
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://qohhrliaecdtaeyfhcvb.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvaGhybGlhZWNkdGFleWZoY3ZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU3MTU1NDYsImV4cCI6MjA4MTI5MTU0Nn0.0j-tjPRX-s2wMCYfJypWo2dlYk9Mi40ueU8z0f00y8A
          VITE_SUPABASE_PROJECT_ID: qohhrliaecdtaeyfhcvb

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Ensure Capacitor asset directories exist
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Resolve Android SDK path
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          if [ ! -d "$SDK_PATH" ]; then
            echo "Android SDK directory not found: $SDK_PATH"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK_PATH" > android/local.properties

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      # ─────────────────────────────────────────────
      # Decode signing keystore (only if secrets provided)
      # ─────────────────────────────────────────────
      - name: Decode release keystore
        id: keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore/release.keystore
          echo "have_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Inject release signing config
        if: steps.keystore.outputs.have_keystore == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/app/signing.gradle << 'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file('keystore/release.keystore')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
          # Append apply line to build.gradle if not present
          if ! grep -q "signing.gradle" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply from: 'signing.gradle'" >> android/app/build.gradle
          fi

      # ─────────────────────────────────────────────
      # Build Debug APK (always)
      # ─────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        if: steps.keystore.outputs.have_keystore != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: modrek-plus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 9
          overwrite: true

      # ─────────────────────────────────────────────
      # Build Signed Release APK + AAB (Play Store ready)
      # ─────────────────────────────────────────────
      - name: Build Release APK (signed)
        if: steps.keystore.outputs.have_keystore == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB (signed — Google Play)
        if: steps.keystore.outputs.have_keystore == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        if: steps.keystore.outputs.have_keystore == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: modrek-plus-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          overwrite: true

      - name: Upload Release AAB (Google Play)
        if: steps.keystore.outputs.have_keystore == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: modrek-plus-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          overwrite: true

      - name: Signing skipped notice
        if: steps.keystore.outputs.have_keystore != 'true'
        run: |
          echo "⚠️ لم يتم العثور على ANDROID_KEYSTORE_BASE64 — تم بناء النسخة Debug فقط."
          echo "أضف الأسرار التالية في GitHub repo → Settings → Secrets and variables → Actions:"
          echo "  - ANDROID_KEYSTORE_BASE64"
          echo "  - ANDROID_KEYSTORE_PASSWORD"
          echo "  - ANDROID_KEY_ALIAS"
          echo "  - ANDROID_KEY_PASSWORD"
