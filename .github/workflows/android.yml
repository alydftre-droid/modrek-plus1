name: Build Android Release APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Regenerate lockfile from package.json
        run: |
          # Always regenerate package-lock.json to keep it in sync with package.json
          # (the repo uses bun.lock as source of truth; npm lockfile is CI-only)
          rm -f package-lock.json npm-shrinkwrap.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/

          if grep -nE "pkg.dev|npm.pkg.github.com" package-lock.json; then
            echo "package-lock.json contains private registry URLs after regeneration"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Validate production push configuration
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::Missing FIREBASE_SERVICE_ACCOUNT GitHub secret; APK/AAB build will continue, but external phone notification delivery requires this secret in the backend deploy workflow."
            {
              echo "## ⚠️ Firebase Cloud Messaging secret is missing"
              echo ""
              echo "The Android app can still be built, but external phone notification delivery requires adding the GitHub repository secret \`FIREBASE_SERVICE_ACCOUNT\` from the Firebase project in \`android/app/google-services.json\` (project: \`dotted-banner-489523-m3\`, sender: \`233651659157\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 <<'PY'
          import json, os, sys

          service_account = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
          google_services = json.load(open("android/app/google-services.json", encoding="utf-8"))
          expected_project_id = google_services["project_info"]["project_id"]
          expected_project_number = google_services["project_info"]["project_number"]
          actual_project_id = service_account.get("project_id")
          client_email = service_account.get("client_email", "")
          if actual_project_id != expected_project_id:
              print(f"::error::FIREBASE_SERVICE_ACCOUNT belongs to '{actual_project_id}', but Android FCM tokens are issued by '{expected_project_id}' (sender {expected_project_number}). Replace the GitHub secret with a service account from the same Firebase project as android/app/google-services.json.")
              sys.exit(1)
          if expected_project_id not in client_email:
              print("::warning::FIREBASE_SERVICE_ACCOUNT client_email does not include the Firebase project id; continuing because project_id matches google-services.json.")
          print(f"Firebase push project verified: {expected_project_id} / sender {expected_project_number}")
          PY
          {
            echo "## ✅ Firebase Cloud Messaging configuration verified"
            echo ""
            echo "Android build will not run database migrations or backend deployments. Those are handled by the dedicated production backend workflow, preventing migration prompts from blocking APK/AAB builds."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Normalize Capacitor Android toolchain files
        run: |
          python3 <<'PY'
          from pathlib import Path

          targets = [
              Path('node_modules/@capacitor/android/capacitor/build.gradle'),
              *Path('node_modules/@capacitor').glob('*/android/build.gradle'),
          ]

          replacements = {
              "classpath 'com.android.tools.build:gradle:8.2.1'": "classpath 'com.android.tools.build:gradle:8.7.3'",
              "classpath 'com.android.tools.build:gradle:8.6.1'": "classpath 'com.android.tools.build:gradle:8.7.3'",
              "compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34": "compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36",
              "compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35": "compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36",
              "targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34": "targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36",
              "targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35": "targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36",
          }

          patched = []
          for path in targets:
              if not path.exists():
                  continue
              original = path.read_text()
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated)
                  patched.append(str(path))

          print(f'Patched {len(patched)} Capacitor Gradle files')
          for path in patched:
              print(path)
          PY

      - name: Verify toolchain
        run: |
          node -v
          npm -v
          java -version
          npx cap --version

      - name: Enforce production Supabase project (qteuqfntsocsdbjmdvmr)
        env:
          VITE_SUPABASE_URL: https://qteuqfntsocsdbjmdvmr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rN8ogJuF9T1Dy6aMkdLVeQ__RbfP19A
        run: |
          EXPECTED_REF="qteuqfntsocsdbjmdvmr"
          EXPECTED_URL="https://${EXPECTED_REF}.supabase.co"
          if [ "$VITE_SUPABASE_URL" != "$EXPECTED_URL" ]; then
            echo "::error::Android build is pointing at the wrong Supabase project: $VITE_SUPABASE_URL (expected $EXPECTED_URL)"
            exit 1
          fi
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) : ;;
            *)
              echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY does not look like a valid publishable key for $EXPECTED_REF"
              exit 1
              ;;
          esac
          echo "Production Supabase project verified: $EXPECTED_REF"

      - name: Build web app
        # CRITICAL: Android APKs MUST be built against the official production
        # Supabase project (qteuqfntsocsdbjmdvmr / modrekplus.com), NEVER the
        # Lovable Cloud fallback (qohhrliaecdtaeyfhcvb). The guard step above
        # fails the build if these values are ever changed.
        env:
          VITE_SUPABASE_URL: https://qteuqfntsocsdbjmdvmr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rN8ogJuF9T1Dy6aMkdLVeQ__RbfP19A
          VITE_SUPABASE_PROJECT_ID: qteuqfntsocsdbjmdvmr
          VITE_GOOGLE_WEB_CLIENT_ID: 233651659157-rt9khk04uo1enfpbmfs5b1c787q7jj5n.apps.googleusercontent.com
        run: |
          # Remove any stray .env file that could leak Lovable Cloud project IDs
          # into the bundle via Vite's import.meta.env inlining.
          rm -f .env .env.local .env.production .env.production.local
          npm run build
          # Post-build verification: the bundled JS must reference the production project ref
          if ! grep -r --include='*.js' -q "qteuqfntsocsdbjmdvmr" dist/; then
            echo "::error::Built bundle does NOT contain the production Supabase project ref (qteuqfntsocsdbjmdvmr). Aborting."
            exit 1
          fi
          if ! grep -r --include='*.js' -q "233651659157-rt9khk04uo1enfpbmfs5b1c787q7jj5n.apps.googleusercontent.com" dist/; then
            echo "::error::Built Android bundle does NOT contain the production Google Web OAuth Client ID. Aborting."
            exit 1
          fi
          if grep -r --include='*.js' -q "qohhrliaecdtaeyfhcvb" dist/; then
            if grep -r --include='*.js' -q "cloud-fallback" dist/ && grep -r --include='*.js' -q "openrouter-tts" dist/; then
              echo "OpenRouter voice fallback endpoint detected; allowed while production voice function deployment catches up."
            else
              echo "::error::Built bundle contains an unexpected Lovable Cloud Supabase project ref (qohhrliaecdtaeyfhcvb). Aborting to prevent split-brain."
              exit 1
            fi
          fi
          if grep -r --include='*.js' -q "lovable.app\|lovableproject.com" dist/; then
            echo "::error::Built bundle contains Lovable preview domains. Aborting production Android build."
            exit 1
          fi
          if grep -r --include='*.js' -q "@capgo/capacitor-social-login\|SocialLogin" dist/; then
            echo "::error::Built bundle contains the legacy Google SocialLogin flow. Aborting."
            exit 1
          fi
          echo "Bundle verified: production Supabase project only."

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify no legacy runtime references
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "google-services.json present — required for Firebase Cloud Messaging (FCM) push notifications. Google Sign-In still uses Google Cloud OAuth + native ID token (not Firebase Auth)."
          else
            echo "::warning::android/app/google-services.json missing — FCM push notifications will be disabled in this build."
          fi
          if grep -R -n "modrek-plus\.lovable\.app\|lovableproject\.com\|@capgo/capacitor-social-login\|capgo-capacitor-social-login\|@lovable.dev/cloud-auth-js" \
            android/app/src android/app/capacitor.build.gradle android/capacitor.settings.gradle src package.json bun.lock package-lock.json; then
            echo "::error::Legacy Lovable/Capgo runtime reference found after Capacitor sync."
            exit 1
          fi
          # After `cap sync`, the built web bundle is copied under
          # android/app/src/main/assets/public — that copy legitimately
          # contains the OpenRouter voice fallback ref because openrouterTts.ts
          # embeds it. The dist/ allow-list check above already validates that
          # bundle, so exclude the synced public/ copy here too.
          if grep -R -n "qohhrliaecdtaeyfhcvb" android/app/src android/app/capacitor.build.gradle android/capacitor.settings.gradle src package.json bun.lock package-lock.json \
            | grep -v "src/lib/openrouterTts.ts" \
            | grep -v "android/app/src/main/assets/public/"; then
            echo "::error::Unexpected Lovable Cloud project ref outside the OpenRouter voice fallback."
            exit 1
          fi

          grep -q 'applicationId "com.modrek.plus"' android/app/build.gradle || { echo "::error::Android package/applicationId must be com.modrek.plus"; exit 1; }
          grep -q "233651659157-rt9khk04uo1enfpbmfs5b1c787q7jj5n.apps.googleusercontent.com" src/lib/googleAuthRuntime.ts || { echo "::error::Production Google Web Client ID is missing from native auth runtime."; exit 1; }
          grep -q "GetSignInWithGoogleOption" android/app/src/main/java/com/modrek/plus/ModrekGoogleAuthPlugin.java || { echo "::error::Credential Manager must use explicit Google button flow."; exit 1; }
          echo "Android OAuth config proof: package=com.modrek.plus, webClient=233651659157-rt9khk04uo1enfpbmfs5b1c787q7jj5n.apps.googleusercontent.com, sign_in=native_id_token, fcm=$( [ -f android/app/google-services.json ] && echo enabled || echo disabled )"


      - name: Re-apply Android SDK 36 fixes after sync
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('android/capacitor-cordova-android-plugins/build.gradle')
          text = path.read_text()
          text = text.replace("classpath 'com.android.tools.build:gradle:8.2.1'", "classpath 'com.android.tools.build:gradle:8.7.3'")
          text = text.replace("classpath 'com.android.tools.build:gradle:8.6.1'", "classpath 'com.android.tools.build:gradle:8.7.3'")
          text = text.replace("compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34", "compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36")
          text = text.replace("compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35", "compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36")
          text = text.replace("targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34", "targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36")
          text = text.replace("targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35", "targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36")
          path.write_text(text)
          PY

      - name: Verify Android toolchain versions
        run: |
          grep -q "com.android.tools.build:gradle:8.7.3" android/build.gradle
          grep -q "compileSdkVersion = 36" android/variables.gradle
          grep -q "targetSdkVersion = 36" android/variables.gradle
          grep -q "gradle-8.9-all.zip" android/gradle/wrapper/gradle-wrapper.properties
          grep -q "com.android.tools.build:gradle:8.7.3" android/capacitor-cordova-android-plugins/build.gradle

      - name: Resolve Android SDK path
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          test -d "$SDK_PATH" || { echo "Android SDK directory not found: $SDK_PATH"; exit 1; }
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK_PATH" > android/local.properties

      - name: Require release signing secrets
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Decode release keystore
        run: |
          mkdir -p android/app/keystore
          # Sanitize the secret: strip whitespace, surrounding quotes, PEM markers,
          # and convert URL-safe base64 (-, _) to standard (+, /). Then try GNU
          # base64 first; fall back to openssl which is more permissive with padding.
          RAW="$ANDROID_KEYSTORE_BASE64"
          CLEAN=$(printf '%s' "$RAW" \
            | tr -d '\r\n\t ' \
            | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" \
            | sed -e 's/-----BEGIN[^-]*-----//g' -e 's/-----END[^-]*-----//g' \
            | tr '_-' '/+')
          if [ -z "$CLEAN" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is empty after sanitization."
            exit 1
          fi
          # Pad to a multiple of 4
          MOD=$(( ${#CLEAN} % 4 ))
          if [ "$MOD" -eq 2 ]; then CLEAN="${CLEAN}=="; fi
          if [ "$MOD" -eq 3 ]; then CLEAN="${CLEAN}="; fi
          if [ "$MOD" -eq 1 ]; then
            echo "ANDROID_KEYSTORE_BASE64 length is invalid (mod 4 == 1). The secret is likely truncated or corrupted."
            exit 1
          fi
          printf '%s' "$CLEAN" | base64 -d > android/app/keystore/release.keystore 2>/dev/null \
            || printf '%s' "$CLEAN" | openssl base64 -d -A > android/app/keystore/release.keystore 2>/dev/null \
            || { echo "Failed to decode ANDROID_KEYSTORE_BASE64. Re-generate it with: base64 -w0 release.keystore | pbcopy (macOS) or base64 -w0 release.keystore (Linux), then update the GitHub secret."; exit 1; }
          if [ ! -s android/app/keystore/release.keystore ]; then
            echo "Decoded keystore is empty. Check ANDROID_KEYSTORE_BASE64 secret value."
            exit 1
          fi

          keytool -list -keystore android/app/keystore/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null \
            || { echo "Keystore/alias/password mismatch. Verify ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."; exit 1; }
          echo "============================================================"
          echo "RELEASE KEYSTORE FINGERPRINTS (paste SHA1 into Google Cloud)"
          echo "Package: com.modrek.plus  |  Project: 233651659157"
          echo "============================================================"
          FINGERPRINTS=$(keytool -list -v -keystore android/app/keystore/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" 2>/dev/null \
            | grep -E "SHA1:|SHA256:")
          echo "$FINGERPRINTS"
          echo "============================================================"
          {
            echo "## 🔑 Android Release Keystore SHA Fingerprints"
            echo ""
            echo "Add the **SHA1** value to your Android OAuth Client in Google Cloud Console:"
            echo "- Package name: \`com.modrek.plus\`"
            echo "- Project number: \`233651659157\`"
            echo ""
            echo '```'
            echo "$FINGERPRINTS"
            echo '```'
            echo ""
            echo "> If you publish via Google Play with Play App Signing, ALSO add the SHA1 shown in Play Console → Setup → App integrity → App signing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Build signed Release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace --warning-mode=summary

      - name: Verify release outputs
        run: |
          ls -lah android/app/build/outputs/bundle/release || true
          ls -lah android/app/build/outputs/apk/release || true
          test -f android/app/build/outputs/bundle/release/app-release.aab || { echo "AAB file not found"; exit 1; }
          test -f android/app/build/outputs/apk/release/app-release.apk || { echo "APK file not found"; exit 1; }

      - name: Publish APK and AAB to stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-latest"
          TITLE="Latest Android Build"
          NOTES="Latest successful Android build for مدرك Plus — run #${{ github.run_number }}"
          APK_FILE="android/app/build/outputs/apk/release/app-release.apk"
          AAB_FILE="android/app/build/outputs/bundle/release/app-release.aab"

          test -f "$APK_FILE" || { echo "APK file not found: $APK_FILE"; exit 1; }
          test -f "$AAB_FILE" || { echo "AAB file not found: $AAB_FILE"; exit 1; }

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" "$AAB_FILE" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_FILE" "$AAB_FILE" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Update Step Summary
        run: |
          {
            echo "## Android build files"
            echo ""
            echo "- [**تحميل APK مباشر**](${{ github.server_url }}/${{ github.repository }}/releases/download/android-latest/app-release.apk)"
            echo "- [**تحميل AAB مباشر**](${{ github.server_url }}/${{ github.repository }}/releases/download/android-latest/app-release.aab)"
            echo ""
            echo "تم إلغاء استخدام Artifacts نهائياً لتفادي مشكلة امتلاء السعة."
          } >> "$GITHUB_STEP_SUMMARY"
