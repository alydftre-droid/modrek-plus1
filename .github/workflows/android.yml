name: Build Android Release APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Regenerate lockfile from package.json
        run: |
          # Always regenerate package-lock.json to keep it in sync with package.json
          # (the repo uses bun.lock as source of truth; npm lockfile is CI-only)
          rm -f package-lock.json npm-shrinkwrap.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/

          if grep -nE "pkg.dev|npm.pkg.github.com" package-lock.json; then
            echo "package-lock.json contains private registry URLs after regeneration"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Normalize Capacitor Android toolchain files
        run: |
          python3 <<'PY'
          from pathlib import Path

          targets = [
              Path('node_modules/@capacitor/android/capacitor/build.gradle'),
              *Path('node_modules/@capacitor').glob('*/android/build.gradle'),
          ]

          replacements = {
              "classpath 'com.android.tools.build:gradle:8.2.1'": "classpath 'com.android.tools.build:gradle:8.6.1'",
              "compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34": "compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35",
              "targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34": "targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35",
          }

          patched = []
          for path in targets:
              if not path.exists():
                  continue
              original = path.read_text()
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated)
                  patched.append(str(path))

          print(f'Patched {len(patched)} Capacitor Gradle files')
          for path in patched:
              print(path)
          PY

      - name: Verify toolchain
        run: |
          node -v
          npm -v
          java -version
          npx cap --version

      - name: Enforce production Supabase project (qteuqfntsocsdbjmdvmr)
        env:
          VITE_SUPABASE_URL: https://qteuqfntsocsdbjmdvmr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rN8ogJuF9T1Dy6aMkdLVeQ__RbfP19A
        run: |
          EXPECTED_REF="qteuqfntsocsdbjmdvmr"
          EXPECTED_URL="https://${EXPECTED_REF}.supabase.co"
          if [ "$VITE_SUPABASE_URL" != "$EXPECTED_URL" ]; then
            echo "::error::Android build is pointing at the wrong Supabase project: $VITE_SUPABASE_URL (expected $EXPECTED_URL)"
            exit 1
          fi
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) : ;;
            *)
              echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY does not look like a valid publishable key for $EXPECTED_REF"
              exit 1
              ;;
          esac
          echo "Production Supabase project verified: $EXPECTED_REF"

      - name: Build web app
        # CRITICAL: Android APKs MUST be built against the official production
        # Supabase project (qteuqfntsocsdbjmdvmr / modrekplus.com), NEVER the
        # Lovable Cloud fallback (qohhrliaecdtaeyfhcvb). The guard step above
        # fails the build if these values are ever changed.
        env:
          VITE_SUPABASE_URL: https://qteuqfntsocsdbjmdvmr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rN8ogJuF9T1Dy6aMkdLVeQ__RbfP19A
        run: |
          npm run build
          # Post-build verification: the bundled JS must reference the production project ref
          if ! grep -r --include='*.js' -q "qteuqfntsocsdbjmdvmr" dist/; then
            echo "::error::Built bundle does NOT contain the production Supabase project ref (qteuqfntsocsdbjmdvmr). Aborting."
            exit 1
          fi
          if grep -r --include='*.js' -q "qohhrliaecdtaeyfhcvb" dist/; then
            echo "::error::Built bundle still contains the Lovable Cloud Supabase project ref (qohhrliaecdtaeyfhcvb). Aborting to prevent split-brain."
            exit 1
          fi
          echo "Bundle verified: production Supabase project only."

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Google Auth Android configuration
        run: npm run verify:google-auth

      - name: Re-apply Android SDK 35 fixes after sync
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('android/capacitor-cordova-android-plugins/build.gradle')
          text = path.read_text()
          text = text.replace("classpath 'com.android.tools.build:gradle:8.2.1'", "classpath 'com.android.tools.build:gradle:8.6.1'")
          text = text.replace("compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34", "compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35")
          text = text.replace("targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34", "targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35")
          path.write_text(text)
          PY

      - name: Verify Android toolchain versions
        run: |
          grep -q "com.android.tools.build:gradle:8.6.1" android/build.gradle
          grep -q "compileSdkVersion = 35" android/variables.gradle
          grep -q "targetSdkVersion = 35" android/variables.gradle
          grep -q "gradle-8.7-all.zip" android/gradle/wrapper/gradle-wrapper.properties
          grep -q "com.android.tools.build:gradle:8.6.1" android/capacitor-cordova-android-plugins/build.gradle

      - name: Resolve Android SDK path
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          test -d "$SDK_PATH" || { echo "Android SDK directory not found: $SDK_PATH"; exit 1; }
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK_PATH" > android/local.properties

      - name: Require release signing secrets
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Decode release keystore
        run: |
          mkdir -p android/app/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/keystore/release.keystore
          if [ ! -s android/app/keystore/release.keystore ]; then
            echo "Decoded keystore is empty. Check ANDROID_KEYSTORE_BASE64 secret value."
            exit 1
          fi
          keytool -list -keystore android/app/keystore/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null \
            || { echo "Keystore/alias/password mismatch. Verify ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."; exit 1; }

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Build signed Release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace --warning-mode=summary

      - name: Verify release outputs
        run: |
          ls -lah android/app/build/outputs/bundle/release || true
          ls -lah android/app/build/outputs/apk/release || true
          test -f android/app/build/outputs/bundle/release/app-release.aab || { echo "AAB file not found"; exit 1; }
          test -f android/app/build/outputs/apk/release/app-release.apk || { echo "APK file not found"; exit 1; }

      - name: Publish APK and AAB to stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-latest"
          TITLE="Latest Android Build"
          NOTES="Latest successful Android build for مدرك Plus — run #${{ github.run_number }}"
          APK_FILE="android/app/build/outputs/apk/release/app-release.apk"
          AAB_FILE="android/app/build/outputs/bundle/release/app-release.aab"

          test -f "$APK_FILE" || { echo "APK file not found: $APK_FILE"; exit 1; }
          test -f "$AAB_FILE" || { echo "AAB file not found: $AAB_FILE"; exit 1; }

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" "$AAB_FILE" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_FILE" "$AAB_FILE" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Update Step Summary
        run: |
          {
            echo "## Android build files"
            echo ""
            echo "- [**تحميل APK مباشر**](${{ github.server_url }}/${{ github.repository }}/releases/download/android-latest/app-release.apk)"
            echo "- [**تحميل AAB مباشر**](${{ github.server_url }}/${{ github.repository }}/releases/download/android-latest/app-release.aab)"
            echo ""
            echo "تم إلغاء استخدام Artifacts نهائياً لتفادي مشكلة امتلاء السعة."
          } >> "$GITHUB_STEP_SUMMARY"
