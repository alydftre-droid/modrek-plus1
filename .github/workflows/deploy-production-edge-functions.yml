name: Deploy Production Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-production-edge-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-edge-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: qteuqfntsocsdbjmdvmr
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRODUCTION_SUPABASE_URL: https://qteuqfntsocsdbjmdvmr.supabase.co
      PRODUCTION_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rN8ogJuF9T1Dy6aMkdLVeQ__RbfP19A
      PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY || secrets.EXTERNAL_SUPABASE_SERVICE_ROLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: dotted-banner-489523-m3
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
      BUNNY_STREAM_LIBRARY_ID: ${{ secrets.BUNNY_STREAM_LIBRARY_ID }}
      BUNNY_STREAM_CDN_HOSTNAME: ${{ secrets.BUNNY_STREAM_CDN_HOSTNAME }}
      BUNNY_STORAGE_API_KEY: ${{ secrets.BUNNY_STORAGE_API_KEY }}
      BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
      BUNNY_STORAGE_CDN_HOSTNAME: ${{ secrets.BUNNY_STORAGE_CDN_HOSTNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Require production deploy token
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN GitHub secret for production Edge Function deploys."; exit 1; }

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Guard production project ref
        run: |
          test "$SUPABASE_PROJECT_REF" = "qteuqfntsocsdbjmdvmr" || { echo "::error::Wrong production project ref: $SUPABASE_PROJECT_REF"; exit 1; }

      - name: Apply production database migrations
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" >/dev/null 2>&1 || true

          # The production database has two legacy migration-history entries
          # from the external transfer that are not present in this repository.
          # Supabase CLI refuses `db push` until remote-only entries are marked
          # reverted. Keep this repair scoped to the exact versions reported by
          # the CLI so real migration errors still fail the deployment.
          supabase migration repair --linked --status reverted 20260518170655 20260519012827 || true

          # Production's schema was originally seeded from a full SQL dump
          # (scripts/apply_external_schema.sh), so its supabase_migrations
          # history table is empty. Without baselining, `db push --include-all`
          # tries to re-run every legacy migration and fails with errors like
          # `relation "profiles" already exists`. Mark every migration created
          # BEFORE the production-deploy workflow was introduced (cutoff:
          # 20260710000000) as already-applied. Newer migrations still push
          # normally. Repair on an already-tracked version is a no-op, so this
          # is safe to run every deploy.
          BASELINE_CUTOFF="20260710000000"
          baseline_versions=""
          for f in supabase/migrations/*.sql; do
            base="$(basename "$f")"
            version="${base%%_*}"
            case "$version" in
              [0-9]*) ;;
              *) continue ;;
            esac
            if [ "$version" \< "$BASELINE_CUTOFF" ]; then
              baseline_versions="$baseline_versions $version"
            fi
          done
          # Repair in chunks to stay under any CLI arg-length limits.
          echo "$baseline_versions" | tr ' ' '\n' | grep -v '^$' | xargs -n 40 -r \
            supabase migration repair --linked --status applied || true

          # Print current migration status BEFORE pushing so any failure is debuggable.
          echo "::group::Migration status before push"
          supabase migration list --linked || true
          echo "::endgroup::"

          # Some Supabase CLI versions ignore --yes on `db push` when stdin is
          # not a TTY (GitHub Actions), leaving the interactive confirmation
          # prompt unanswered and the step failing. Pipe `y` explicitly so the
          # prompt is always answered, and dump the remote migration list on
          # failure to surface the real underlying error.
          if ! yes | supabase db push --linked --include-all --debug 2>&1 | tee /tmp/db-push.log; then
            echo "::error::supabase db push failed. Dumping migration list for diagnostics."
            supabase migration list --linked || true
            exit 1
          fi

      - name: Require production runtime secrets
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing PRODUCTION_SUPABASE_SERVICE_ROLE_KEY or EXTERNAL_SUPABASE_SERVICE_ROLE_KEY GitHub secret."; exit 1; }
          test -n "$OPENROUTER_API_KEY" || { echo "::error::Missing OPENROUTER_API_KEY GitHub secret for production OpenRouter voice."; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::Missing FIREBASE_SERVICE_ACCOUNT GitHub secret; Android push notifications cannot use FCM HTTP v1 without it."; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "::error::Missing GEMINI_API_KEY GitHub secret for production AI functions."; exit 1; }
          test -n "$BUNNY_STREAM_API_KEY" || { echo "::error::Missing BUNNY_STREAM_API_KEY GitHub secret for production video creation."; exit 1; }
          test -n "$BUNNY_STREAM_LIBRARY_ID" || { echo "::error::Missing BUNNY_STREAM_LIBRARY_ID GitHub secret; video creation must not fall back to a guessed Bunny library."; exit 1; }
          test -n "$BUNNY_STREAM_CDN_HOSTNAME" || { echo "::error::Missing BUNNY_STREAM_CDN_HOSTNAME GitHub secret for production video playback."; exit 1; }
          test -n "$BUNNY_STORAGE_API_KEY" || { echo "::error::Missing BUNNY_STORAGE_API_KEY GitHub secret for production storage uploads."; exit 1; }
          test -n "$BUNNY_STORAGE_ZONE" || { echo "::error::Missing BUNNY_STORAGE_ZONE GitHub secret for production storage uploads."; exit 1; }
          test -n "$BUNNY_STORAGE_CDN_HOSTNAME" || { echo "::error::Missing BUNNY_STORAGE_CDN_HOSTNAME GitHub secret for production storage downloads."; exit 1; }

      - name: Verify production library queue RPC is visible
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/library-enqueue-rpc.json -w '%{http_code}' -X POST "$PRODUCTION_SUPABASE_URL/rest/v1/rpc/enqueue_library_book_processing" \
            -H "apikey: $PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"_book_id":"00000000-0000-0000-0000-000000000000"}')"
          body="$(cat /tmp/library-enqueue-rpc.json)"
          if echo "$body" | grep -qiE 'Could not find the function|schema cache|PGRST202|PGRST204'; then
            echo "::error::Production library queue RPC is missing from the REST schema cache. HTTP $status"
            cat /tmp/library-enqueue-rpc.json
            exit 1
          fi
          if [ "$status" = "404" ]; then
            echo "::error::Production library queue RPC endpoint returned 404."
            cat /tmp/library-enqueue-rpc.json
            exit 1
          fi
          echo "Production library queue RPC is visible to the REST schema cache (HTTP $status)."

      - name: Sync production library worker runtime settings
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps([
              {"key": "library_worker_url", "value": os.environ["PRODUCTION_SUPABASE_URL"].rstrip("/") + "/functions/v1/library-worker"},
              {"key": "library_worker_anon_key", "value": os.environ["PRODUCTION_SUPABASE_PUBLISHABLE_KEY"]},
              {"key": "supabase_anon_key", "value": os.environ["PRODUCTION_SUPABASE_PUBLISHABLE_KEY"]},
              {"key": "supabase_url", "value": os.environ["PRODUCTION_SUPABASE_URL"].rstrip("/")},
          ]))
          PY
          )"
          status="$(curl -sS -o /tmp/library-worker-settings.json -w '%{http_code}' -X POST "$PRODUCTION_SUPABASE_URL/rest/v1/platform_settings?on_conflict=key" \
            -H "apikey: $PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            --data "$payload")"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Failed to sync production library worker runtime settings. HTTP $status"
            cat /tmp/library-worker-settings.json
            exit 1
          fi

      - name: Sync production Edge Function secrets
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, sys

          service_account = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
          google_services = json.load(open("android/app/google-services.json", encoding="utf-8"))
          expected_project_id = google_services["project_info"]["project_id"]
          expected_project_number = google_services["project_info"]["project_number"]
          actual_project_id = service_account.get("project_id")
          if actual_project_id != expected_project_id:
              print(f"::error::FIREBASE_SERVICE_ACCOUNT belongs to '{actual_project_id}', but Android FCM tokens are issued by '{expected_project_id}' (sender {expected_project_number}). Replace the GitHub secret with a service account from the same Firebase project as android/app/google-services.json.")
              sys.exit(1)
          print(f"Firebase push project verified: {expected_project_id} / sender {expected_project_number}")
          PY
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            GEMINI_API_KEY="$GEMINI_API_KEY" \
            OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            BUNNY_STREAM_API_KEY="$BUNNY_STREAM_API_KEY" \
            BUNNY_STREAM_LIBRARY_ID="$BUNNY_STREAM_LIBRARY_ID" \
            BUNNY_STREAM_CDN_HOSTNAME="$BUNNY_STREAM_CDN_HOSTNAME" \
            BUNNY_STORAGE_API_KEY="$BUNNY_STORAGE_API_KEY" \
            BUNNY_STORAGE_ZONE="$BUNNY_STORAGE_ZONE" \
            BUNNY_STORAGE_CDN_HOSTNAME="$BUNNY_STORAGE_CDN_HOSTNAME" \
            FIREBASE_SERVICE_ACCOUNT="$FIREBASE_SERVICE_ACCOUNT" \
            FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            PRODUCTION_SUPABASE_PUBLISHABLE_KEY="$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            PRODUCTION_APP_ORIGIN="https://modrekplus.com" \
            PRODUCTION_SUPABASE_PROJECT_REF="$SUPABASE_PROJECT_REF" \
            PRODUCTION_SUPABASE_URL="$PRODUCTION_SUPABASE_URL"
      - name: Deploy functions to production project only
        run: |
          set -euo pipefail
          for fn_dir in supabase/functions/*; do
            test -d "$fn_dir" || continue
            fn="$(basename "$fn_dir")"
            case "$fn" in
              _shared|.*) continue ;;
              # MCP is generated for Lovable's app integration and currently
              # bundles to ~26 MB, which exceeds the production Edge deploy
              # request limit and fails with HTTP 413. It is not part of the
              # production student/teacher/admin runtime, so exclude it from
              # this external production deploy loop.
              mcp) echo "Skipping $fn: generated MCP function exceeds production deploy size limit"; continue ;;
            esac
            echo "Deploying $fn to $SUPABASE_PROJECT_REF"
            case "$fn" in
              library-worker|library-admin|library-v2-enqueue|library-v2-dispatcher|library-v2-worker)
                supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
                ;;
              *)
                supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
                ;;
            esac
          done

      - name: Verify deployment target stayed production
        run: |
          echo "Edge Functions deployed to production project ref: $SUPABASE_PROJECT_REF"

      - name: Smoke test production function deployment
        run: |
          set -euo pipefail
          base="$PRODUCTION_SUPABASE_URL/functions/v1"
          for fn in ai-chat teacher-assistant support-assistant generate-exam grade-essay openrouter-tts bunny-stream bunny-storage library-admin library-worker library-v2-enqueue library-v2-dispatcher library-v2-worker modrek-worker ai-health-check send-push-notification send-content-notification; do
            status="$(curl -sS -o /tmp/edge-${fn}.txt -w '%{http_code}' -X OPTIONS "$base/$fn" \
              -H "apikey: $PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
              -H "Origin: https://modrekplus.com" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: authorization,apikey,content-type,x-library-trace-id,x-worker-key")"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::Production Edge Function $fn did not respond to OPTIONS. HTTP $status"
              cat "/tmp/edge-${fn}.txt"
              exit 1
            fi
          done

      - name: Verify production AI provider secrets through ai-health-check
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing PRODUCTION_SUPABASE_SERVICE_ROLE_KEY or EXTERNAL_SUPABASE_SERVICE_ROLE_KEY GitHub secret for production health checks."; exit 1; }
          status="$(curl -sS -o /tmp/ai-health.json -w '%{http_code}' -X POST "$PRODUCTION_SUPABASE_URL/functions/v1/ai-health-check" \
            -H "apikey: $PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"source":"github-production-smoke-test"}')"
          cat /tmp/ai-health.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Production AI health check failed. HTTP $status"
            exit 1
          fi

      - name: Verify production Bunny Stream credentials
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/bunny-stream-health.json -w '%{http_code}' -X GET "$PRODUCTION_SUPABASE_URL/functions/v1/bunny-stream?action=health" \
            -H "apikey: $PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $PRODUCTION_SUPABASE_SERVICE_ROLE_KEY")"
          cat /tmp/bunny-stream-health.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Production Bunny Stream health check failed. HTTP $status"
            exit 1
          fi

      - name: Verify production Bunny Storage credentials
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/bunny-storage-health.json -w '%{http_code}' -X GET "$PRODUCTION_SUPABASE_URL/functions/v1/bunny-storage?action=health" \
            -H "apikey: $PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $PRODUCTION_SUPABASE_SERVICE_ROLE_KEY")"
          cat /tmp/bunny-storage-health.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Production Bunny Storage health check failed. HTTP $status"
            exit 1
          fi