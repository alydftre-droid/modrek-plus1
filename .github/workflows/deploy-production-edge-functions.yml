name: Deploy Production Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-production-edge-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-edge-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: qteuqfntsocsdbjmdvmr
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRODUCTION_SUPABASE_URL: https://qteuqfntsocsdbjmdvmr.supabase.co
      PRODUCTION_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rN8ogJuF9T1Dy6aMkdLVeQ__RbfP19A
      PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY || secrets.EXTERNAL_SUPABASE_SERVICE_ROLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: dotted-banner-489523-m3
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
      BUNNY_STREAM_LIBRARY_ID: ${{ secrets.BUNNY_STREAM_LIBRARY_ID }}
      BUNNY_STREAM_CDN_HOSTNAME: ${{ secrets.BUNNY_STREAM_CDN_HOSTNAME }}
      BUNNY_STORAGE_API_KEY: ${{ secrets.BUNNY_STORAGE_API_KEY }}
      BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
      BUNNY_STORAGE_CDN_HOSTNAME: ${{ secrets.BUNNY_STORAGE_CDN_HOSTNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Require production deploy token
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN GitHub secret for production Edge Function deploys."; exit 1; }

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Guard production project ref
        run: |
          test "$SUPABASE_PROJECT_REF" = "qteuqfntsocsdbjmdvmr" || { echo "::error::Wrong production project ref: $SUPABASE_PROJECT_REF"; exit 1; }

      - name: Emergency deploy critical Library V2 functions before migrations
        run: |
          set -euo pipefail
          # The live upload page calls these endpoints directly. If an older
          # database migration blocks the rest of the workflow, the browser must
          # still not receive HTTP 404 / preflight failure for Library V2.
          for fn in library-v2-enqueue library-v2-dispatcher library-v2-worker; do
            echo "Pre-deploying critical Library V2 function: $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          done

      - name: Harden historical Modrek AI migration for production replay
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("supabase/migrations/20260712105101_4bfa3893-c738-4564-a8af-0368873bb410.sql")
          sql = path.read_text(encoding="utf-8")

          replacements = {
              "CREATE TABLE public.modrek_ai_conversations (": "CREATE TABLE IF NOT EXISTS public.modrek_ai_conversations (",
              "CREATE INDEX idx_modrek_ai_conv_student ON public.modrek_ai_conversations(student_id, last_message_at DESC);": "CREATE INDEX IF NOT EXISTS idx_modrek_ai_conv_student ON public.modrek_ai_conversations(student_id, last_message_at DESC);",
              "CREATE TABLE public.modrek_ai_messages (": "CREATE TABLE IF NOT EXISTS public.modrek_ai_messages (",
              "CREATE INDEX idx_modrek_ai_msg_conv ON public.modrek_ai_messages(conversation_id, created_at);": "CREATE INDEX IF NOT EXISTS idx_modrek_ai_msg_conv ON public.modrek_ai_messages(conversation_id, created_at);",
              "CREATE POLICY \"Students manage their own AI conversations\"\n  ON public.modrek_ai_conversations": "DROP POLICY IF EXISTS \"Students manage their own AI conversations\" ON public.modrek_ai_conversations;\nCREATE POLICY \"Students manage their own AI conversations\"\n  ON public.modrek_ai_conversations",
              "CREATE POLICY \"Students access messages of their conversations\"\n  ON public.modrek_ai_messages": "DROP POLICY IF EXISTS \"Students access messages of their conversations\" ON public.modrek_ai_messages;\nCREATE POLICY \"Students access messages of their conversations\"\n  ON public.modrek_ai_messages",
              "CREATE TRIGGER modrek_ai_msg_touch_conv\n  AFTER INSERT ON public.modrek_ai_messages": "DROP TRIGGER IF EXISTS modrek_ai_msg_touch_conv ON public.modrek_ai_messages;\nCREATE TRIGGER modrek_ai_msg_touch_conv\n  AFTER INSERT ON public.modrek_ai_messages",
              "CREATE TRIGGER modrek_ai_conv_updated_at\n  BEFORE UPDATE ON public.modrek_ai_conversations": "DROP TRIGGER IF EXISTS modrek_ai_conv_updated_at ON public.modrek_ai_conversations;\nCREATE TRIGGER modrek_ai_conv_updated_at\n  BEFORE UPDATE ON public.modrek_ai_conversations",
              "CREATE POLICY \"Students access their own Modrek AI exams\"\n  ON public.exams": "DROP POLICY IF EXISTS \"Students access their own Modrek AI exams\" ON public.exams;\nCREATE POLICY \"Students access their own Modrek AI exams\"\n  ON public.exams",
          }

          for old, new in replacements.items():
              sql = sql.replace(old, new)

          marker = "CREATE INDEX IF NOT EXISTS idx_modrek_ai_conv_student ON public.modrek_ai_conversations(student_id, last_message_at DESC);"
          if "modrek_ai_conversations_production_replay_hardening" not in sql:
              sql = sql.replace(marker, marker + """

-- modrek_ai_conversations_production_replay_hardening
-- Production may already contain this table from a previous partial/manual run
-- while the migration history row is missing. Complete the shape safely.
ALTER TABLE public.modrek_ai_conversations
  ADD COLUMN IF NOT EXISTS student_id UUID REFERENCES auth.users(id) ON DELETE CASCADE,
  ADD COLUMN IF NOT EXISTS assistant_type TEXT NOT NULL DEFAULT 'study',
  ADD COLUMN IF NOT EXISTS title TEXT NOT NULL DEFAULT 'محادثة جديدة',
  ADD COLUMN IF NOT EXISTS context_json JSONB NOT NULL DEFAULT '{}'::jsonb,
  ADD COLUMN IF NOT EXISTS last_message_at TIMESTAMPTZ NOT NULL DEFAULT now(),
  ADD COLUMN IF NOT EXISTS is_archived BOOLEAN NOT NULL DEFAULT false,
  ADD COLUMN IF NOT EXISTS created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
  ADD COLUMN IF NOT EXISTS updated_at TIMESTAMPTZ NOT NULL DEFAULT now();

DO $$
BEGIN
  IF NOT EXISTS (
    SELECT 1 FROM pg_constraint
    WHERE conname = 'modrek_ai_conversations_assistant_type_check'
      AND conrelid = 'public.modrek_ai_conversations'::regclass
  ) THEN
    ALTER TABLE public.modrek_ai_conversations
      ADD CONSTRAINT modrek_ai_conversations_assistant_type_check
      CHECK (assistant_type IN ('study','exams','review'));
  END IF;
END $$;
""")

          marker = "CREATE INDEX IF NOT EXISTS idx_modrek_ai_msg_conv ON public.modrek_ai_messages(conversation_id, created_at);"
          if "modrek_ai_messages_production_replay_hardening" not in sql:
              sql = sql.replace(marker, marker + """

-- modrek_ai_messages_production_replay_hardening
ALTER TABLE public.modrek_ai_messages
  ADD COLUMN IF NOT EXISTS conversation_id UUID REFERENCES public.modrek_ai_conversations(id) ON DELETE CASCADE,
  ADD COLUMN IF NOT EXISTS role TEXT NOT NULL DEFAULT 'user',
  ADD COLUMN IF NOT EXISTS parts JSONB NOT NULL DEFAULT '[]'::jsonb,
  ADD COLUMN IF NOT EXISTS attachments JSONB DEFAULT '[]'::jsonb,
  ADD COLUMN IF NOT EXISTS metadata JSONB DEFAULT '{}'::jsonb,
  ADD COLUMN IF NOT EXISTS created_at TIMESTAMPTZ NOT NULL DEFAULT now();

DO $$
BEGIN
  IF NOT EXISTS (
    SELECT 1 FROM pg_constraint
    WHERE conname = 'modrek_ai_messages_role_check'
      AND conrelid = 'public.modrek_ai_messages'::regclass
  ) THEN
    ALTER TABLE public.modrek_ai_messages
      ADD CONSTRAINT modrek_ai_messages_role_check
      CHECK (role IN ('user','assistant','system','tool'));
  END IF;
END $$;
""")

          path.write_text(sql, encoding="utf-8")
          print("Hardened production replay migration:", path.name)
          PY

      - name: Apply production database migrations
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" >/dev/null 2>&1 || true

          # Print current migration status BEFORE pushing so any failure is debuggable.
          echo "::group::Migration status before push"
          supabase migration list --linked || true
          echo "::endgroup::"

          # Some Supabase CLI versions ignore --yes on `db push` when stdin is
          # not a TTY (GitHub Actions), leaving the interactive confirmation
          # prompt unanswered and the step failing. Pipe `y` explicitly so the
          # prompt is always answered, and dump the remote migration list on
          # failure to surface the real underlying error.
          if ! yes | supabase db push --linked --include-all --debug 2>&1 | tee /tmp/db-push.log; then
            echo "::error::supabase db push failed. First failing statement and migration context follow."
            grep -nE "ERROR:|SQLSTATE|At statement|Applying migration|Finished" /tmp/db-push.log || true
            supabase migration list --linked || true
            exit 1
          fi

      - name: Require production runtime secrets
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing PRODUCTION_SUPABASE_SERVICE_ROLE_KEY or EXTERNAL_SUPABASE_SERVICE_ROLE_KEY GitHub secret."; exit 1; }
          test -n "$OPENROUTER_API_KEY" || { echo "::error::Missing OPENROUTER_API_KEY GitHub secret for production OpenRouter voice."; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::Missing FIREBASE_SERVICE_ACCOUNT GitHub secret; Android push notifications cannot use FCM HTTP v1 without it."; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "::error::Missing GEMINI_API_KEY GitHub secret for production AI functions."; exit 1; }
          test -n "$BUNNY_STREAM_API_KEY" || { echo "::error::Missing BUNNY_STREAM_API_KEY GitHub secret for production video creation."; exit 1; }
          test -n "$BUNNY_STREAM_LIBRARY_ID" || { echo "::error::Missing BUNNY_STREAM_LIBRARY_ID GitHub secret; video creation must not fall back to a guessed Bunny library."; exit 1; }
          test -n "$BUNNY_STREAM_CDN_HOSTNAME" || { echo "::error::Missing BUNNY_STREAM_CDN_HOSTNAME GitHub secret for production video playback."; exit 1; }
          test -n "$BUNNY_STORAGE_API_KEY" || { echo "::error::Missing BUNNY_STORAGE_API_KEY GitHub secret for production storage uploads."; exit 1; }
          test -n "$BUNNY_STORAGE_ZONE" || { echo "::error::Missing BUNNY_STORAGE_ZONE GitHub secret for production storage uploads."; exit 1; }
          test -n "$BUNNY_STORAGE_CDN_HOSTNAME" || { echo "::error::Missing BUNNY_STORAGE_CDN_HOSTNAME GitHub secret for production storage downloads."; exit 1; }

      - name: Verify production library queue RPC is visible
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/library-enqueue-rpc.json -w '%{http_code}' -X POST "$PRODUCTION_SUPABASE_URL/rest/v1/rpc/enqueue_library_book_processing" \
            -H "apikey: $PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"_book_id":"00000000-0000-0000-0000-000000000000"}')"
          body="$(cat /tmp/library-enqueue-rpc.json)"
          if echo "$body" | grep -qiE 'Could not find the function|schema cache|PGRST202|PGRST204'; then
            echo "::error::Production library queue RPC is missing from the REST schema cache. HTTP $status"
            cat /tmp/library-enqueue-rpc.json
            exit 1
          fi
          if [ "$status" = "404" ]; then
            echo "::error::Production library queue RPC endpoint returned 404."
            cat /tmp/library-enqueue-rpc.json
            exit 1
          fi
          echo "Production library queue RPC is visible to the REST schema cache (HTTP $status)."

      - name: Sync production library worker runtime settings
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps([
              {"key": "library_worker_url", "value": os.environ["PRODUCTION_SUPABASE_URL"].rstrip("/") + "/functions/v1/library-worker"},
              {"key": "library_worker_anon_key", "value": os.environ["PRODUCTION_SUPABASE_PUBLISHABLE_KEY"]},
              {"key": "supabase_anon_key", "value": os.environ["PRODUCTION_SUPABASE_PUBLISHABLE_KEY"]},
              {"key": "supabase_url", "value": os.environ["PRODUCTION_SUPABASE_URL"].rstrip("/")},
          ]))
          PY
          )"
          status="$(curl -sS -o /tmp/library-worker-settings.json -w '%{http_code}' -X POST "$PRODUCTION_SUPABASE_URL/rest/v1/platform_settings?on_conflict=key" \
            -H "apikey: $PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            --data "$payload")"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Failed to sync production library worker runtime settings. HTTP $status"
            cat /tmp/library-worker-settings.json
            exit 1
          fi

      - name: Sync production Edge Function secrets
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, sys

          service_account = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
          google_services = json.load(open("android/app/google-services.json", encoding="utf-8"))
          expected_project_id = google_services["project_info"]["project_id"]
          expected_project_number = google_services["project_info"]["project_number"]
          actual_project_id = service_account.get("project_id")
          if actual_project_id != expected_project_id:
              print(f"::error::FIREBASE_SERVICE_ACCOUNT belongs to '{actual_project_id}', but Android FCM tokens are issued by '{expected_project_id}' (sender {expected_project_number}). Replace the GitHub secret with a service account from the same Firebase project as android/app/google-services.json.")
              sys.exit(1)
          print(f"Firebase push project verified: {expected_project_id} / sender {expected_project_number}")
          PY
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            GEMINI_API_KEY="$GEMINI_API_KEY" \
            OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            BUNNY_STREAM_API_KEY="$BUNNY_STREAM_API_KEY" \
            BUNNY_STREAM_LIBRARY_ID="$BUNNY_STREAM_LIBRARY_ID" \
            BUNNY_STREAM_CDN_HOSTNAME="$BUNNY_STREAM_CDN_HOSTNAME" \
            BUNNY_STORAGE_API_KEY="$BUNNY_STORAGE_API_KEY" \
            BUNNY_STORAGE_ZONE="$BUNNY_STORAGE_ZONE" \
            BUNNY_STORAGE_CDN_HOSTNAME="$BUNNY_STORAGE_CDN_HOSTNAME" \
            FIREBASE_SERVICE_ACCOUNT="$FIREBASE_SERVICE_ACCOUNT" \
            FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            PRODUCTION_SUPABASE_PUBLISHABLE_KEY="$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            PRODUCTION_APP_ORIGIN="https://modrekplus.com" \
            PRODUCTION_SUPABASE_PROJECT_REF="$SUPABASE_PROJECT_REF" \
            PRODUCTION_SUPABASE_URL="$PRODUCTION_SUPABASE_URL"
      - name: Deploy functions to production project only
        run: |
          set -euo pipefail
          for fn_dir in supabase/functions/*; do
            test -d "$fn_dir" || continue
            fn="$(basename "$fn_dir")"
            case "$fn" in
              _shared|.*) continue ;;
              # MCP is generated for Lovable's app integration and currently
              # bundles to ~26 MB, which exceeds the production Edge deploy
              # request limit and fails with HTTP 413. It is not part of the
              # production student/teacher/admin runtime, so exclude it from
              # this external production deploy loop.
              mcp) echo "Skipping $fn: generated MCP function exceeds production deploy size limit"; continue ;;
            esac
            echo "Deploying $fn to $SUPABASE_PROJECT_REF"
            case "$fn" in
              library-worker|library-admin|library-v2-enqueue|library-v2-dispatcher|library-v2-worker)
                supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
                ;;
              *)
                supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
                ;;
            esac
          done

      - name: Verify deployment target stayed production
        run: |
          set -euo pipefail
          expected_url="https://${SUPABASE_PROJECT_REF}.supabase.co"
          test "$PRODUCTION_SUPABASE_URL" = "$expected_url" || {
            echo "::error::Production URL/ref mismatch. SUPABASE_PROJECT_REF=$SUPABASE_PROJECT_REF PRODUCTION_SUPABASE_URL=$PRODUCTION_SUPABASE_URL expected=$expected_url"
            exit 1
          }
          echo "Edge Functions deployment target verified: PROJECT_REF=$SUPABASE_PROJECT_REF URL=$PRODUCTION_SUPABASE_URL"

      - name: List production Edge Functions and require Library V2
        run: |
          set -euo pipefail
          echo "::group::supabase functions list --project-ref $SUPABASE_PROJECT_REF"
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" | tee /tmp/production-functions-list.txt
          echo "::endgroup::"
          for fn in library-v2-enqueue library-v2-dispatcher library-v2-worker; do
            if ! grep -Eq "(^|[[:space:]│|])${fn}([[:space:]│|]|$)" /tmp/production-functions-list.txt; then
              echo "::error::Production Edge Function is missing from project $SUPABASE_PROJECT_REF: $fn"
              exit 1
            fi
          done

      - name: Smoke test production function deployment
        run: |
          set -euo pipefail
          base="$PRODUCTION_SUPABASE_URL/functions/v1"
          for fn in ai-chat teacher-assistant support-assistant grade-essay openrouter-tts bunny-stream bunny-storage library-admin library-worker library-v2-enqueue library-v2-dispatcher library-v2-worker modrek-worker ai-health-check send-push-notification send-content-notification; do
            status="$(curl -sS -D "/tmp/edge-${fn}.headers" -o "/tmp/edge-${fn}.body" -w '%{http_code}' -X OPTIONS "$base/$fn" \
              -H "apikey: $PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
              -H "Origin: https://modrekplus.com" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: authorization,apikey,content-type,x-library-trace-id,x-worker-key")"
            echo "OPTIONS $base/$fn => HTTP $status"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::Production Edge Function $fn did not respond to OPTIONS. HTTP $status"
              cat "/tmp/edge-${fn}.body"
              exit 1
            fi
            headers="$(cat "/tmp/edge-${fn}.headers" | tr -d '\r')"
            if ! echo "$headers" | grep -qi '^access-control-allow-methods:.*POST'; then
              echo "::error::Production Edge Function $fn OPTIONS response is missing Access-Control-Allow-Methods: POST."
              cat "/tmp/edge-${fn}.headers"
              exit 1
            fi
            case "$fn" in
              library-v2-enqueue|library-v2-dispatcher|library-v2-worker)
                if ! echo "$headers" | grep -qi '^access-control-allow-headers:.*x-library-trace-id'; then
                  echo "::error::Production Edge Function $fn OPTIONS response is missing x-library-trace-id in Access-Control-Allow-Headers."
                  cat "/tmp/edge-${fn}.headers"
                  exit 1
                fi
                ;;
            esac
          done

      - name: Direct invoke proof for Library V2 functions
        run: |
          set -euo pipefail
          base="$PRODUCTION_SUPABASE_URL/functions/v1"
          echo "Production request target: PROJECT_REF=$SUPABASE_PROJECT_REF URL=$PRODUCTION_SUPABASE_URL ORIGIN=https://modrekplus.com"
          for fn in library-v2-enqueue library-v2-dispatcher library-v2-worker; do
            case "$fn" in
              library-v2-enqueue) payload='{"book_id":"00000000-0000-0000-0000-000000000000","source":"github-production-proof"}' ;;
              library-v2-dispatcher) payload='{"source":"github-production-proof"}' ;;
              library-v2-worker) payload='{"job_id":"00000000-0000-0000-0000-000000000000","source":"github-production-proof"}' ;;
            esac
            status="$(curl -sS -D "/tmp/v2-${fn}.headers" -o "/tmp/v2-${fn}.body" -w '%{http_code}' -X POST "$base/$fn" \
              -H "apikey: $PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
              -H "Origin: https://modrekplus.com" \
              -H "Content-Type: application/json" \
              -H "x-library-trace-id: github-production-proof" \
              --data "$payload")"
            echo "POST $base/$fn => HTTP $status"
            echo "Response body:"
            cat "/tmp/v2-${fn}.body"
            echo
            if [ "$status" = "404" ]; then
              echo "::error::$fn returned 404 on $SUPABASE_PROJECT_REF; this proves the function is not deployed on the same project ref used by modrekplus.com."
              exit 1
            fi
          done

      - name: Verify production AI provider secrets through ai-health-check
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing PRODUCTION_SUPABASE_SERVICE_ROLE_KEY or EXTERNAL_SUPABASE_SERVICE_ROLE_KEY GitHub secret for production health checks."; exit 1; }
          status="$(curl -sS -o /tmp/ai-health.json -w '%{http_code}' -X POST "$PRODUCTION_SUPABASE_URL/functions/v1/ai-health-check" \
            -H "apikey: $PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"source":"github-production-smoke-test"}')"
          cat /tmp/ai-health.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Production AI health check failed. HTTP $status"
            exit 1
          fi

      - name: Verify production Bunny Stream credentials
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/bunny-stream-health.json -w '%{http_code}' -X GET "$PRODUCTION_SUPABASE_URL/functions/v1/bunny-stream?action=health" \
            -H "apikey: $PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $PRODUCTION_SUPABASE_SERVICE_ROLE_KEY")"
          cat /tmp/bunny-stream-health.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Production Bunny Stream health check failed. HTTP $status"
            exit 1
          fi

      - name: Verify production Bunny Storage credentials
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/bunny-storage-health.json -w '%{http_code}' -X GET "$PRODUCTION_SUPABASE_URL/functions/v1/bunny-storage?action=health" \
            -H "apikey: $PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $PRODUCTION_SUPABASE_SERVICE_ROLE_KEY")"
          cat /tmp/bunny-storage-health.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Production Bunny Storage health check failed. HTTP $status"
            exit 1
          fi